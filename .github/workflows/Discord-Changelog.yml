name: Send Changelog to Discord

on:
  release:
    types: [published]

jobs:
  send-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Send Release Notes to Discord
        env:
          # UPDATED HERE: Using the specific changelog secret
          WEBHOOK_URL: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }} 
        run: |
          if [ -z "$WEBHOOK_URL" ] || [ "$WEBHOOK_URL" == "RL" ]; then
            echo "Webhook secret is empty or invalid!"
            exit 1
          fi

          TAG="${{ github.event.release.tag_name }}"
          NAME="${{ github.event.release.name }}"
          BODY="${{ github.event.release.body }}"
          URL="${{ github.event.release.html_url }}"

          if [ -z "$BODY" ]; then
            BODY="No detailed changelog provided. Click the link below to view the release."
          fi

          TRUNCATED_BODY=$(echo "$BODY" | head -c 1500)

          MESSAGE="🚀 **ChimeraClient Update: $NAME ($TAG)** 🚀\n\n$TRUNCATED_BODY\n\n🔗 **[View Full Release on GitHub]($URL)**"

          PAYLOAD=$(jq -n --arg content "$MESSAGE" '{content: $content}')

          curl -H "Content-Type: application/json" \
               -X POST \
               -d "$PAYLOAD" \
               "$WEBHOOK_URL"
