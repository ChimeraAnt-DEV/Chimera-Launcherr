name: Notify Discord

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      message:
        description: 'Custom message'
        required: true
        default: 'A new update for ChimeraClient has been released!'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Notification
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK_URL" ] || [ "$WEBHOOK_URL" == "RL" ]; then
            echo "Webhook secret is empty or set to the placeholder 'RL'!"
            exit 1
          fi

          if [ "${{ github.event_name }}" == "release" ]; then
            MESSAGE="🚀 **New ChimeraClient Release!**\nVersion: ${{ github.event.release.tag_name }}\nNotes: [Read here](${{ github.event.release.html_url }})"
          else
            MESSAGE="${{ github.event.inputs.message }}"
          fi

          # Use jq to safely format the JSON payload
          PAYLOAD=$(jq -n --arg content "$MESSAGE" '{content: $content}')

          curl -H "Content-Type: application/json" \
               -X POST \
               -d "$PAYLOAD" \
               "$WEBHOOK_URL"
